}

/* =====================  FRISE  ===================== */
const tlBody = $("#tlBody"), ruler = $("#ruler"), evBand = $("#evBand"), laneIn = $("#laneIn"), playhead = $("#playhead");
const tlW = () => tlBody.clientWidth || 1;
const yToX = y => (y - tview.a) / (tview.b - tview.a) * tlW();
const xToY = x => tview.a + x / tlW() * (tview.b - tview.a);

function tlVisibleCivs() {
  let list = db.civs.slice();
  if (tlFilter === "live") list = list.filter(c => alive(c));
  if (tlFilter === "sel") { const c = selCiv(); list = c ? [c] : []; }
  return list.sort((a, b) => a.start - b.start || (a.end ?? Y1) - (b.end ?? Y1));
}
function renderTimeline() {
  /* règle graduée */
  ruler.textContent = "";
  const span = tview.b - tview.a, w = tlW();
  const steps = [2000, 1000, 500, 250, 100, 50, 25, 10, 5, 1];
  let step = steps[0];
  for (const st of steps) if (st / span * w >= 74) step = st;
  const start = Math.ceil(tview.a / step) * step;
  for (let y = start; y <= tview.b; y += step) {
    const x = yToX(y); if (x < -40 || x > w + 40) continue;
    const t = el("div", { class: "tk", style: `left:${x}px` }, el("span", {}, fmtYear(y, false)));
    ruler.append(t);
  }
  const sub = step / (step % 4 === 0 ? 4 : step % 5 === 0 ? 5 : 2);
  if (sub / span * w > 9) for (let y = Math.ceil(tview.a / sub) * sub; y <= tview.b; y += sub) {
    if (Math.abs(y % step) < 1e-6) continue;
    ruler.append(el("div", { class: "tk minor", style: `left:${yToX(y)}px` }));
  }

  /* bande d'événements : épisodes longs en barres, jalons en repères, étapes au second rang */
  evBand.textContent = "";
  const c = selCiv();
  const evs = c ? evOf(c.id) : db.events;
  evBand.append(el("span", { class: "eyebrow lbl" }, c ? `Événements · ${c.name}` : `Événements · tous (${evs.length})`));
  const selEv = sel && sel.type === "event" ? sel.id : null;
  for (const e of evs) {
    const row = e.parentId ? " r1" : "";
    const x0 = yToX(e.year), x1 = yToX(evEnd(e));
    if (x1 < -80 || x0 > w + 80) continue;
    const n = (evLong(e) && x1 - x0 > 3)
      ? el("div", { class: "evs" + row + (selEv === e.id ? " sel" : ""), style: `left:${x0}px;width:${x1 - x0}px` },
        x1 - x0 > 46 ? el("span", {}, e.title) : null)
      : el("div", { class: "ev" + row + (selEv === e.id ? " sel" : ""), style: `left:${x0}px` }, [el("i"), el("b")]);
    n.addEventListener("click", ev => { ev.stopPropagation(); select("event", e.id); });
    n.addEventListener("pointerenter", ev => showTipTL(ev, `<b>${esc(e.title)}</b><br><span class="yr">${evLong(e) ? fmtSpan(e.year, evEnd(e)) : fmtYear(e.year, true)}</span>`));
    n.addEventListener("pointerleave", hideTip);
    evBand.append(n);
  }

  /* Bandes de civilisations. L'empilement suit les filiations : une civilisation
     issue d'une autre reprend si possible sa ligne, à la suite ; sinon la ligne
     libre la plus proche. Les autres comblent les trous à partir du haut. */
  laneIn.textContent = "";
  const list = tlVisibleCivs(), pos = new Map(), selId = c?.id;
  const geo = new Map();
  for (const cv of list) {
    const x0 = yToX(cv.start), x1 = Math.max(yToX(cv.end ?? Y1), x0 + 3);
    if (x1 < -200 || x0 > w + 200) continue;
    geo.set(cv.id, { cv, x0, x1: x0 + Math.max(x1 - x0, 3) });
  }
  const heirs = new Map();
  for (const l of db.links) {
    if (!geo.has(l.from) || !geo.has(l.to)) continue;
    if (!heirs.has(l.from)) heirs.set(l.from, []);
    heirs.get(l.from).push(l.to);
  }
  const lanes = [], place = new Map();
  /* gap négatif : on tolère le chevauchement d'un ou deux pixels pour qu'une
     succession exacte — un empire qui commence l'année où l'autre finit —
     reste sur la même ligne, bord à bord. */
  const fits = (li, g, gap) => !lanes[li].some(iv => g.x0 < iv[1] + gap && iv[0] < g.x1 + gap);
  function findLane(g, pref) {
    const has = pref !== null && pref !== undefined;
    if (has && pref < lanes.length && fits(pref, g, -2)) return pref;
    if (has) for (let d = 1; d <= lanes.length; d++) {
      if (pref + d < lanes.length && fits(pref + d, g, 6)) return pref + d;
      if (pref - d >= 0 && fits(pref - d, g, 6)) return pref - d;
    }
    for (let k = 0; k < lanes.length; k++) if (fits(k, g, 6)) return k;
    lanes.push([]); return lanes.length - 1;
  }
  function assign(id, pref) {
    if (place.has(id)) return;
    const g = geo.get(id); if (!g) return;
    const li = findLane(g, pref);
    lanes[li].push([g.x0, g.x1]); place.set(id, li);
    (heirs.get(id) || []).filter(k => !place.has(k))
      .sort((p, q) => geo.get(p).x0 - geo.get(q).x0)
      .forEach(k => assign(k, li));
  }
  for (const cv of list) if (geo.has(cv.id)) assign(cv.id, null);

  for (const cv of list) {
    const g = geo.get(cv.id); if (!g) continue;
    const li = place.get(cv.id);
    /* le nom reste lisible même quand la bande déborde de la fenêtre */
    const vx = Math.max(g.x0, -1), vw = Math.max(Math.min(g.x1, w + 1) - vx, 3);
    const bar = el("div", {
      class: "bar" + (selId === cv.id ? " sel" : "") + (alive(cv) ? "" : " off"),
      style: `left:${vx}px;width:${vw}px;top:${li * 21}px;background:${cv.color}44;border-color:${cv.color}`,
      title: `${cv.name} · ${fmtSpan(cv.start, cv.end)}`,
      onclick: () => select("civ", cv.id)
    }, el("span", {}, cv.name));
    bar.dataset.civ = cv.id;
    pos.set(cv.id, { x0: g.x0, x1: g.x1, y: li * 21 + 8.5 });
    bar.addEventListener("pointerenter", ev => showTipTL(ev, `<b>${esc(cv.name)}</b><br><span class="yr">${fmtSpan(cv.start, cv.end)}</span>`));
    bar.addEventListener("pointerleave", hideTip);
    laneIn.append(bar);
  }
  /* période de sujétion : la trame de la puissance dominante barre la bande */
  for (const x of db.subjections) {
    const p = pos.get(x.civId), ov = civ(x.overId);
    if (!p || !ov) continue;
    const a = Math.max(yToX(x.start), p.x0), b2 = Math.min(yToX(x.end), p.x1);
    if (b2 - a < 1 || b2 < -40 || a > w + 40) continue;
    const d = el("div", {
      class: "subj", style: `left:${a}px;width:${b2 - a}px;top:${p.y - 8.5}px;--c:${ov.color}`,
      title: `${civ(x.civId)?.name} · ${subjWord(x)} · ${fmtSpan(x.start, x.end)}`,
      onclick: e => { e.stopPropagation(); select("civ", x.overId); }
    });
    d.addEventListener("pointerenter", ev => showTipTL(ev, `<b>${esc(civ(x.civId)?.name)}</b> — ${esc(subjWord(x))}<br><span class="yr">${fmtSpan(x.start, x.end)}</span>`));
    d.addEventListener("pointerleave", hideTip);
    laneIn.append(d);
  }
  laneIn.style.height = Math.max(lanes.length * 21 + 12, 40) + "px";
  drawLinks(pos, lanes.length, w);
  if (!laneIn.children.length) laneIn.append(el("div", { class: "tl-empty" }, tlFilter === "sel" ? "Sélectionnez une civilisation." : "Aucune civilisation dans cette fenêtre."));
  $("#tlCount").textContent = `${list.length} civilisation${list.length > 1 ? "s" : ""}`;
  positionPlayhead();
}
/* Les filiations relient la fin d'une civilisation au début de celle qui en
   procède : un trait fin, mis en évidence quand l'une des deux est choisie. */
function drawLinks(pos, laneCount, w) {
  const old = laneIn.querySelector("svg.filiations"); if (old) old.remove();
  if (!showLinks || !db.links.length) return;
  const h = Math.max(laneCount * 21 + 12, 40);
  const svg = svgEl("svg", { class: "filiations", width: "100%", height: h, viewBox: `0 0 ${Math.max(w, 1)} ${h}`, preserveAspectRatio: "none" });
  const selId = selCiv()?.id;
  let drawn = 0;
  for (const l of db.links) {
    const a = pos.get(l.from), b = pos.get(l.to);
    if (!a || !b) continue;
    const ty = linkYear(l);
    const x1 = ty !== null ? clamp(yToX(ty), a.x0, a.x1) : a.x1;
    const x2 = ty !== null ? clamp(yToX(ty), b.x0, b.x1) : b.x0;
    if (Math.max(x1, x2) < -60 || Math.min(x1, x2) > w + 60) continue;
    const on = selId === l.from || selId === l.to;
    const dx = clamp(Math.abs(x2 - x1) / 2, 8, 26);
    const g = svgEl("g", { class: "lk" + (on ? " on" : "") });
    const d = `M${x1},${a.y} C${x1 + dx},${a.y} ${x2 - dx},${b.y} ${x2},${b.y}`;
    g.append(svgEl("path", { d }));
    g.append(svgEl("path", { class: "hit", d }));
    g.append(svgEl("circle", { cx: x1, cy: a.y, r: 2.2, class: "src" }));
    const dir = x2 >= x1 ? 1 : -1;
    g.append(svgEl("path", { class: "hd", d: `M${x2},${b.y}L${x2 - 5 * dir},${b.y - 3}L${x2 - 5 * dir},${b.y + 3}Z` }));
    const t = svgEl("title");
    t.textContent = `${civ(l.from)?.name} → ${civ(l.to)?.name}${l.label ? " · " + l.label : ""}${ty !== null ? " · " + fmtYear(ty, true) : ""}`;
    g.append(t);
    g.addEventListener("click", e => {
      e.stopPropagation();
      if (l.eventId && byId(db.events, l.eventId)) select("event", l.eventId);
      else select("civ", selId === l.to ? l.from : l.to);
    });
    svg.append(g); drawn++;
  }
  if (drawn) laneIn.append(svg);
}

function showTipTL(e, html) {
  const r = $(".mapwrap").getBoundingClientRect();
  tip.innerHTML = html; tip.classList.add("on");
  tip.style.left = clamp(e.clientX - r.left - 60, 4, r.width - 200) + "px";
  tip.style.top = (r.height - 46) + "px";
}
function positionPlayhead() {
  const x = yToX(year);
  playhead.style.display = (x < -2 || x > tlW() + 2) ? "none" : "block";
  playhead.style.left = x + "px";
}
function updateBarsLive() {
  for (const b of laneIn.children) {
    const cv = civ(b.dataset?.civ); if (!cv) continue;
    b.classList.toggle("off", !alive(cv));
  }
  renderLegend();
}

/* interactions frise */
let tldrag = false;
function tlSetFromEvent(e) {
  const r = tlBody.getBoundingClientRect();
  setYear(xToY(e.clientX - r.left));
}
tlBody.addEventListener("pointerdown", e => {
  if (e.target.closest(".bar,.ev,.evs") || e.target.closest("svg.filiations")) return;
  tldrag = true; tlBody.setPointerCapture(e.pointerId); tlSetFromEvent(e);
});
tlBody.addEventListener("pointermove", e => { if (tldrag) tlSetFromEvent(e); });
tlBody.addEventListener("pointerup", () => { tldrag = false; });
tlBody.addEventListener("wheel", e => {
  e.preventDefault();
  const r = tlBody.getBoundingClientRect(), px0 = e.clientX - r.left;
  if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    const d = (e.deltaX || e.deltaY) / tlW() * (tview.b - tview.a);
    tview.a += d; tview.b += d;
  } else {
    const y = xToY(px0), f = Math.exp(e.deltaY * .0016);
    let a = y - (y - tview.a) * f, b = y + (tview.b - y) * f;
    if (b - a < 25) { const m = (a + b) / 2; a = m - 12.5; b = m + 12.5; }
    if (b - a > (Y1 - Y0) * 1.05) { a = Y0; b = Y1; }
    tview.a = a; tview.b = b;
  }
  clampTView(); renderTimeline();
}, { passive: false });
function clampTView() {
  const span = tview.b - tview.a;
  if (tview.a < Y0 - span * .05) { tview.a = Y0 - span * .05; tview.b = tview.a + span; }
  if (tview.b > Y1 + span * .05) { tview.b = Y1 + span * .05; tview.a = tview.b - span; }
}
function tlZoom(f) {
  const m = year >= tview.a && year <= tview.b ? year : (tview.a + tview.b) / 2;
  let a = m - (m - tview.a) * f, b = m + (tview.b - m) * f;
  if (b - a < 25) { a = m - 12.5; b = m + 12.5; }
  tview.a = a; tview.b = b; clampTView(); renderTimeline();
}
function tlFocus(a, b) {
  const pad = Math.max((b - a) * .25, 40);
  tview.a = a - pad; tview.b = b + pad; clampTView(); renderTimeline();
}
/* =====================  PANNEAU LATÉRAL  ===================== */
const panel = $("#panel");
const KINDS = { capitale: "Capitale", ville: "Ville", site: "Site", bataille: "Bataille", autre: "Autre" };

function icon(name) {
  const p = {
    pen: '<path d="M11.2 2.6l2.2 2.2-8 8-2.9.7.7-2.9z"/>',
    trash: '<path d="M3.5 4.5h9M6.5 4.5V3h3v1.5M5 4.5l.6 8.5h4.8l.6-8.5"/>',
    plus: '<path d="M8 3.5v9M3.5 8h9"/>',
    target: '<circle cx="8" cy="8" r="4.6"/><path d="M8 1v2.2M8 12.8V15M1 8h2.2M12.8 8H15"/>',
    up: '<path d="M4 10l4-4 4 4"/>',
    copy: '<rect x="5.5" y="5.5" width="8" height="8" rx="1"/><path d="M10.5 5.5V3.5a1 1 0 00-1-1h-6a1 1 0 00-1 1v6a1 1 0 001 1h2"/>',
    link: '<path d="M6.5 9.5l3-3M6.8 4.4l1.3-1.3a2.4 2.4 0 013.4 3.4L10.2 7.8M9.2 11.6l-1.3 1.3a2.4 2.4 0 01-3.4-3.4L5.8 8.2"/>'
  }[name];
  const s = svgEl("svg", { width: 15, height: 15, viewBox: "0 0 16 16", fill: "none", stroke: "currentColor", "stroke-width": 1.4, "stroke-linecap": "round", "stroke-linejoin": "round" });
  s.innerHTML = p; return s;
}
const iconBtn = (name, title, fn, cls = "") => el("button", { class: "iconbtn " + cls, title, "aria-label": title, onclick: e => { e.stopPropagation(); fn(); } }, icon(name));

function renderPanel() {
  $$(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  panel.textContent = "";
  if (tab === "data") return renderData();
  if (tab === "items") return renderItems();
  return renderSheet();
}

/* ---- onglet Fiche ---- */
function renderSheet() {
  if (!sel) {
    panel.append(el("div", { class: "empty" }, [
      el("p", {}, "Rien de sélectionné."),
      el("p", {}, "Cliquez sur un territoire, un lieu ou une bande de la frise."),
      el("div", { class: "row", style: "justify-content:center;margin-top:14px" }, [
        el("button", { class: "btn", onclick: () => openCivForm() }, "+ Civilisation"),
        el("button", { class: "btn", onclick: () => { tab = "items"; renderPanel(); } }, "Tout parcourir")
      ])
    ]));
    return;
  }
  if (sel.type === "poi") return sheetPoi(byId(db.pois, sel.id));
  if (sel.type === "event") return sheetEvent(byId(db.events, sel.id));
  const c = selCiv(); if (!c) { sel = null; return renderSheet(); }
  sheetCiv(c);
}

function head(kindLabel, color, title, sub, meta) {
  const h = el("div", { class: "sheet-head" });
  h.append(el("div", { class: "kind" }, [
    color ? el("span", { class: "dot", style: `background:${color}` }) : null,
    el("span", { class: "eyebrow" }, kindLabel)
  ]));
  h.append(el("h2", {}, title));
  if (sub) h.append(el("div", { class: "dates" }, sub));
  if (meta) h.append(el("div", { class: "meta" }, meta));
  return h;
}
function proseBlock(text, links) {
  const wrap = el("div", { class: "sect" });
  const p = el("div", { class: "prose" });
  p.innerHTML = text ? md(text) : `<p style="color:var(--muted)">Aucune description. Cliquez sur <em>Modifier</em> pour en ajouter une, ou importez le résumé d'une page Wikipédia.</p>`;
  wrap.append(p);
  if (links && links.length) {
    const L = el("div", { class: "links", style: "margin-top:10px" });
    L.append(el("div", { class: "eyebrow", style: "margin-bottom:4px" }, "Liens"));
    links.forEach(l => L.append(el("a", { href: l.url, target: "_blank", rel: "noopener" }, l.label || l.url)));
    wrap.append(L);
  }
  return wrap;
}

function sheetCiv(c) {
  const ts = terrOf(c.id), evs = evOf(c.id), ps = poisOf(c.id);
  const h = head("Civilisation", c.color, c.name, fmtSpan(c.start, c.end), c.region);
  if (alive(c)) h.querySelector(".kind").append(el("span", { class: "pill live" }, "en " + fmtYear(year, false)));
  const nowSubj = subjAt(c.id);
  if (nowSubj) h.querySelector(".kind").append(el("span", {
    class: "pill", style: `border-color:${civ(nowSubj.overId)?.color};color:${civ(nowSubj.overId)?.color}`
  }, subjWord(nowSubj)));
  h.append(el("div", { class: "row" }, [
    el("button", { class: "btn", onclick: () => openCivForm(c) }, "Modifier"),
    el("button", { class: "btn", onclick: () => { const t = ts.find(t => alive(t)) || ts[0]; t ? fitTo(t.rings) : toast("Aucun territoire tracé"); } }, "Cadrer"),
    el("button", { class: "btn", onclick: () => tlFocus(c.start, c.end ?? Y1) }, "Cadrer la frise"),
    el("button", { class: "btn danger", onclick: () => delCiv(c) }, "Supprimer")
  ]));
  panel.append(h);
  panel.append(proseBlock(c.description, c.links));

  const asSub = subjAs(c.id), asOver = subjOver(c.id);
  panel.append(listSection(`Tutelles · ${asSub.length + asOver.length}`, "Ajouter", () => openSubjForm(null, { civId: c.id }),
    asSub.map(x => ({
      t: "⤓ " + (civ(x.overId)?.name || "?"),
      s: (SUBJ[x.kind] || SUBJ.tutelle)[0] + " · " + fmtSpan(x.start, x.end) + (subjAt(c.id) === x ? " · en cours" : ""),
      on: () => { setYear(clamp(year, x.start, x.end)); select("civ", c.id, { keepYear: true }); },
      edit: () => openSubjForm(x, { civId: c.id }),
      del: () => { mutate(() => db.subjections = db.subjections.filter(y => y.id !== x.id)); renderAll(); }
    })).concat(asOver.map(x => ({
      t: "⤒ " + (civ(x.civId)?.name || "?"),
      s: (SUBJ[x.kind] || SUBJ.tutelle)[0] + " · " + fmtSpan(x.start, x.end),
      on: () => select("civ", x.civId),
      edit: () => openSubjForm(x, { civId: c.id }),
      del: () => { mutate(() => db.subjections = db.subjections.filter(y => y.id !== x.id)); renderAll(); }
    }))),
    "Une civilisation qui subsiste mais passe sous le contrôle d'une autre : ⤓ elle subit, ⤒ elle domine. La carte et la frise le montrent sur la période."));

  const ins = linksIn(c.id), outs = linksOut(c.id);
  panel.append(listSection(`Filiation · ${ins.length + outs.length}`, "Ajouter", () => openLinkForm(null, { from: c.id }),
    ins.map(l => ({
      t: "← " + (civ(l.from)?.name || "?"),
      s: (l.label || "dont elle procède") + (linkYear(l) !== null ? " · " + fmtYear(linkYear(l), true) : ""),
      on: () => select("civ", l.from),
      edit: () => openLinkForm(l, { from: c.id }),
      del: () => { mutate(() => db.links = db.links.filter(x => x.id !== l.id)); renderAll(); }
    })).concat(outs.map(l => ({
      t: "→ " + (civ(l.to)?.name || "?"),
      s: (l.label || "à laquelle elle donne naissance") + (linkYear(l) !== null ? " · " + fmtYear(linkYear(l), true) : ""),
      on: () => select("civ", l.to),
      edit: () => openLinkForm(l, { from: c.id }),
      del: () => { mutate(() => db.links = db.links.filter(x => x.id !== l.id)); renderAll(); }
    }))),
    "Reliez cette civilisation à celle dont elle procède, ou à celles qui lui succèdent. Le lien se dessine sur la frise."));

  panel.append(listSection(`Territoires · ${ts.length}`, "Ajouter",
    () => (db.territories.some(t => t.rings && t.rings.length) ? openTerrCopy(c.id) : setMode("drawTerr", { civId: c.id })),
    ts.map(t => ({
      t: t.label || fmtSpan(t.start, t.end),
      s: fmtSpan(t.start, t.end) + (alive(t) ? " · affiché" : ""),
      live: alive(t),
      on: () => select("terr", t.id),
      copy: () => openTerrCopy(c.id, t.id),
      edit: () => openTerrForm(t),
      geom: () => { editTerrId = t.id; fitTo(t.rings); setMode("editGeom"); },
      del: () => { if (confirm(`Supprimer le territoire « ${t.label || fmtSpan(t.start, t.end)} » ?`)) { mutate(() => db.territories = db.territories.filter(x => x.id !== t.id)); renderAll(); } }
    })), "Un territoire = une emprise valable entre deux dates. Créez-en un par phase d'expansion."));

  panel.append(listSection(`Événements · ${evs.length}`, "Ajouter", () => openEventForm(null, { civId: c.id, year }),
    evTop(c.id).map(e => {
      const k = evKids(e.id).length;
      return {
        t: e.title,
        s: (evLong(e) ? fmtSpan(e.year, evEnd(e)) : fmtYear(e.year, true))
          + (k ? ` · ${k} étape${k > 1 ? "s" : ""}` : "") + (evHasGeo(e) ? " · cartographié" : ""),
        on: () => select("event", e.id),
        edit: () => openEventForm(e),
        del: () => delEvent(e)
      };
    })));

  panel.append(listSection(`Lieux · ${ps.length}`, "Placer", () => { select("civ", c.id, { keepYear: true }); setMode("placePoi"); },
    ps.map(p => ({
      t: p.name, s: KINDS[p.kind] + " · " + fmtSpan(p.start, p.end),
      on: () => select("poi", p.id, { fit: true }),
      edit: () => openPoiForm(p),
      del: () => { mutate(() => db.pois = db.pois.filter(x => x.id !== p.id)); renderAll(); }
    }))));
}

function sheetPoi(p) {
  if (!p) { sel = null; return renderSheet(); }
  const c = p.civId ? civ(p.civId) : null;
  const h = head(KINDS[p.kind] || "Lieu", c?.color, p.name, fmtSpan(p.start, p.end),
    `${Math.abs(p.lat).toFixed(2)}°${p.lat >= 0 ? "N" : "S"} · ${Math.abs(p.lon).toFixed(2)}°${p.lon >= 0 ? "E" : "O"}`);
  if (c) h.append(el("div", { class: "meta" }, [el("button", { class: "btn sm", onclick: () => select("civ", c.id, { keepYear: true }) }, "↑ " + c.name)]));
  h.append(el("div", { class: "row" }, [
    el("button", { class: "btn", onclick: () => openPoiForm(p) }, "Modifier"),
    el("button", { class: "btn", onclick: () => fitTo([[[p.lon - 5, p.lat - 4], [p.lon + 5, p.lat + 4]]]) }, "Cadrer"),
    el("button", { class: "btn danger", onclick: () => { if (confirm(`Supprimer « ${p.name} » ?`)) { mutate(() => db.pois = db.pois.filter(x => x.id !== p.id)); sel = null; renderAll(); } } }, "Supprimer")
  ]));
  panel.append(h);
  panel.append(proseBlock(p.description, p.links));
}

function delEvent(e) {
  const k = evKids(e.id);
  if (!confirm(k.length ? `Supprimer « ${e.title} » et ses ${k.length} étapes ?` : `Supprimer « ${e.title} » ?`)) return;
  mutate(() => { db.events = db.events.filter(x => x.id !== e.id && x.parentId !== e.id); });
  sel = e.parentId ? { type: "event", id: e.parentId } : null;
  renderAll();
}
function evPts(e) {
  const pts = (e.arrows || []).flatMap(a => a.pts);
  if (e.lon !== null && e.lon !== undefined) pts.push([e.lon, e.lat]);
  for (const k of evKids(e.id)) {
    pts.push(...(k.arrows || []).flatMap(a => a.pts));
    if (k.lon !== null && k.lon !== undefined) pts.push([k.lon, k.lat]);
  }
  return pts;
}

function sheetEvent(e) {
  if (!e) { sel = null; return renderSheet(); }
  const c = e.civId ? civ(e.civId) : null;
  const parent = e.parentId ? byId(db.events, e.parentId) : null;
  const kids = evKids(e.id);
  const long = evLong(e);
  const h = head(parent ? "Étape" : long ? "Épisode" : "Événement", c?.color, e.title,
    long ? fmtSpan(e.year, evEnd(e)) : fmtYear(e.year, true),
    [e.kind && e.kind !== "jalon" ? EVKINDS[e.kind] : null, c?.name].filter(Boolean).join(" · "));
  if (evAlive(e) && long) h.querySelector(".kind").append(el("span", { class: "pill live" }, "en cours"));
  h.append(el("div", { class: "row" }, [
    el("button", { class: "btn", onclick: () => openEventForm(e) }, "Modifier"),
    evPts(e).length ? el("button", { class: "btn", onclick: () => fitTo([evPts(e)]) }, "Cadrer") : null,
    parent ? el("button", { class: "btn", onclick: () => select("event", parent.id) }, "↑ " + parent.title) : null,
    c && !parent ? el("button", { class: "btn", onclick: () => select("civ", c.id, { keepYear: true }) }, "↑ " + c.name) : null,
    el("button", { class: "btn danger", onclick: () => delEvent(e) }, "Supprimer")
  ]));
  panel.append(h);
  panel.append(proseBlock(e.description, e.links));

  /* lieu */
  const loc = el("div", { class: "sect" });
  const placed = e.lon !== null && e.lon !== undefined;
  loc.append(el("div", { class: "sect-h" }, [
    el("span", { class: "eyebrow" }, "Lieu"),
    el("button", { class: "btn sm", onclick: () => { select("event", e.id, { keepYear: true }); setMode("placeEvPt", { target: e.id }); } },
      placed ? "Déplacer" : "+ Placer")
  ]));
  if (!placed) loc.append(el("div", { class: "meta" }, "Aucun point sur la carte. Utile pour une bataille, un siège, la signature d'un traité."));
  else loc.append(el("div", { class: "item" }, [
    el("button", { class: "main", onclick: () => fitTo([[[e.lon - 5, e.lat - 4], [e.lon + 5, e.lat + 4]]]) }, [
      el("span", { class: "t" }, EVKINDS[e.kind] || "Point"),
      el("span", { class: "s" }, `${Math.abs(e.lat).toFixed(2)}°${e.lat >= 0 ? "N" : "S"} · ${Math.abs(e.lon).toFixed(2)}°${e.lon >= 0 ? "E" : "O"}`)
    ]),
    el("div", { class: "acts" }, iconBtn("trash", "Retirer le point", () => { mutate(() => { e.lon = null; e.lat = null; }); renderAll(); }, "danger"))
  ]));
  panel.append(loc);

  /* mouvements */
  const arrows = e.arrows || [];
  panel.append(listSection(`Mouvements · ${arrows.length}`, "Tracer",
    () => { select("event", e.id, { keepYear: true }); setMode("drawArrow", { target: e.id }); },
    arrows.map((a, i) => ({
      t: a.label || "Mouvement " + (i + 1),
      s: `${a.pts.length} points${a.dash ? " · trait discontinu" : ""}`,
      on: () => fitTo([a.pts]),
      geom: () => { editArrow = { evId: e.id, i }; editTerrId = null; fitTo([a.pts]); setMode("editGeom"); },
      edit: () => openArrowForm(e, i),
      del: () => { mutate(() => e.arrows.splice(i, 1)); renderAll(); }
    })),
    "Une flèche par déplacement d'armée, migration ou expédition : cliquez les étapes sur la carte, du départ vers l'arrivée."));

  /* étapes */
  if (!parent) panel.append(listSection(`Étapes · ${kids.length}`, "Ajouter",
    () => openEventForm(null, { civId: e.civId, year: e.year, parentId: e.id }),
    kids.map(k => ({
      t: k.title,
      s: (evLong(k) ? fmtSpan(k.year, evEnd(k)) : fmtYear(k.year, true)) + (evHasGeo(k) ? " · cartographié" : ""),
      on: () => select("event", k.id),
      edit: () => openEventForm(k),
      del: () => delEvent(k)
    })),
    "Découpez un épisode long en batailles, sièges ou traités successifs."));
  else {
    const sib = evKids(parent.id).filter(k => k.id !== e.id);
    if (sib.length) panel.append(listSection(`Autres étapes · ${sib.length}`, "Ajouter",
      () => openEventForm(null, { civId: e.civId, year: e.year, parentId: parent.id }),
      sib.map(k => ({
        t: k.title, s: fmtYear(k.year, true),
        on: () => select("event", k.id), edit: () => openEventForm(k), del: () => delEvent(k)
      }))));
  }
}

function listSection(title, addLabel, addFn, rows, help) {
  const s = el("div", { class: "sect" });
  s.append(el("div", { class: "sect-h" }, [
    el("span", { class: "eyebrow" }, title),
    el("button", { class: "btn sm", onclick: addFn }, "+ " + addLabel)
  ]));
  if (!rows.length) s.append(el("div", { class: "meta" }, help || "Rien pour l'instant."));
  rows.forEach(r => {
    const it = el("div", { class: "item" });
    it.append(el("button", { class: "main", onclick: r.on }, [
      el("span", { class: "t" }, r.t),
      el("span", { class: "s" }, r.s)
    ]));
    const acts = el("div", { class: "acts" });
    if (r.copy) acts.append(iconBtn("copy", "Reprendre ce tracé pour une autre période", r.copy));
    if (r.geom) acts.append(iconBtn("target", "Modifier le tracé", r.geom));
    acts.append(iconBtn("pen", "Modifier", r.edit));
    acts.append(iconBtn("trash", "Supprimer", r.del, "danger"));
    it.append(acts);
    s.append(it);
  });
  return s;
}

function delCiv(c) {
  const n = terrOf(c.id).length + evOf(c.id).length + poisOf(c.id).length;
  if (!confirm(`Supprimer « ${c.name} » et ses ${n} éléments rattachés ?`)) return;
  mutate(() => {
    db.civs = db.civs.filter(x => x.id !== c.id);
    db.territories = db.territories.filter(x => x.civId !== c.id);
    db.events = db.events.filter(x => x.civId !== c.id);
    db.pois = db.pois.filter(x => x.civId !== c.id);
    db.links = db.links.filter(x => x.from !== c.id && x.to !== c.id);
    db.subjections = db.subjections.filter(x => x.civId !== c.id && x.overId !== c.id);
  });
  sel = null; renderAll();
}

/* =====================  FORMULAIRES  ===================== */
const PALETTE = ["#8c3b2e", "#2c4a63", "#4a6b45", "#7a5a2e", "#5b4a72", "#2f6b6b", "#a06a2c", "#6b2f45", "#3f5a8a", "#6e7a3a", "#8a5b6b", "#455055"];

function openForm(title, fields, values, onSave, extra) {
  const root = $("#modalRoot");
  const state = Object.assign({}, values);
  const body = el("div", { class: "body" });
  const controls = {};
  for (const f of fields) {
    if (f.type === "row") {
      const g = el("div", { class: "grid2" });
      f.fields.forEach(sub => g.append(field(sub)));
      body.append(g); continue;
    }
    body.append(field(f));
  }
  function field(f) {
    const w = el("div", { class: "f" });
    w.append(el("label", { for: "f-" + f.key }, f.label));
    let c;
    if (f.type === "textarea") c = el("textarea", { id: "f-" + f.key, rows: f.rows || 6 });
    else if (f.type === "select") {
      c = el("select", { id: "f-" + f.key });
      f.options.forEach(o => c.append(el("option", { value: o[0] }, o[1])));
    } else if (f.type === "color") {
      c = el("div", { class: "swatches" });
      PALETTE.forEach(col => c.append(el("button", {
        type: "button", style: `background:${col}`, class: state[f.key] === col ? "on" : "",
        onclick: e => { state[f.key] = col; [...c.children].forEach(b => b.classList.remove("on")); e.currentTarget.classList.add("on"); }
      })));
      w.append(c); return w;
    } else c = el("input", { id: "f-" + f.key, type: f.type === "number" ? "text" : "text", inputmode: f.type === "number" ? "text" : null, placeholder: f.ph || "" });
    if (c.tagName !== "DIV") c.value = state[f.key] ?? "";
    controls[f.key] = c;
    w.append(c);
    if (f.help) w.append(el("div", { class: "help" }, f.help));
    if (f.after) w.append(f.after(c, state));
    return w;
  }
  const modal = el("div", { class: "modal" }, [
    el("header", {}, [el("h3", {}, title), el("button", { class: "iconbtn", onclick: close, "aria-label": "Fermer" }, "✕")]),
    body,
    el("footer", {}, [
      extra || null,
      el("button", { class: "btn", onclick: close }, "Annuler"),
      el("button", { class: "btn prim", onclick: commit }, "Enregistrer")
    ])
  ]);
  const scrim = el("div", { class: "scrim", onclick: e => { if (e.target === scrim) close(); } }, modal);
  root.append(scrim);
  setTimeout(() => { const first = body.querySelector("input,textarea,select"); first && first.focus(); }, 20);
  function close() { scrim.remove(); document.removeEventListener("keydown", key, true); }
  function key(e) { if (e.key === "Escape") { e.stopPropagation(); close(); } if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) commit(); }
  document.addEventListener("keydown", key, true);
  function commit() {
    const out = Object.assign({}, state);
    for (const k in controls) out[k] = controls[k].value;
    for (const f of flat(fields)) if (f.type === "number") out[f.key] = parseYear(out[f.key]);
    if (onSave(out) !== false) close();
  }
  function flat(fs) { return fs.flatMap(f => f.type === "row" ? f.fields : [f]); }
  return { close, state, controls };
}
const linksToText = ls => (ls || []).map(l => (l.label ? l.label + " | " : "") + l.url).join("\n");
const textToLinks = t => String(t || "").split("\n").map(s => s.trim()).filter(Boolean).map(s => {
  const i = s.lastIndexOf("|");
  if (i > 0) return { label: s.slice(0, i).trim(), url: s.slice(i + 1).trim() };
  return { label: s.replace(/^https?:\/\/(www\.)?/, "").slice(0, 42), url: s };
});

function wikiField() {
  return (descCtrl, state) => {
    const inp = el("input", { type: "text", placeholder: "https://fr.wikipedia.org/wiki/Empire_romain" });
    const btn = el("button", { class: "btn", type: "button" }, "Importer");
    btn.addEventListener("click", async () => {
      const v = inp.value.trim(); if (!v) return;
      btn.textContent = "…"; btn.disabled = true;
      try {
        const m = v.match(/\/wiki\/([^#?]+)/);
        const t = decodeURIComponent(m ? m[1] : v).replace(/ /g, "_");
        const lang = (v.match(/https?:\/\/(\w{2})\.wikipedia/) || [, "fr"])[1];
        const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`);
        if (!r.ok) throw 0;
        const j = await r.json();
        descCtrl.value = (descCtrl.value ? descCtrl.value + "\n\n" : "") + j.extract;
        const lk = document.querySelector("#f-linksText");
        const url = j.content_urls?.desktop?.page || v;
        if (lk && !lk.value.includes(url)) lk.value = (lk.value ? lk.value + "\n" : "") + "Wikipédia — " + j.title + " | " + url;
        toast("Résumé importé");
      } catch (e) { toast("Wikipédia injoignable — collez le texte à la main"); }
      btn.textContent = "Importer"; btn.disabled = false;
    });
    return el("div", { class: "wiki", style: "margin-top:6px" }, [inp, btn]);
  };
}

function openCivForm(c) {
  const isNew = !c;
  openForm(isNew ? "Nouvelle civilisation" : "Modifier la civilisation", [
    { key: "name", label: "Nom", ph: "Empire romain" },
    {
      type: "row", fields: [
        { key: "start", label: "Début", type: "number", ph: "-509", help: "Négatif = av. J.-C." },
        { key: "end", label: "Fin", type: "number", ph: "476" }]
    },
    { key: "region", label: "Aire", ph: "Méditerranée · Europe" },
    { key: "color", label: "Couleur", type: "color" },
    { key: "description", label: "Description", type: "textarea", help: "Mise en forme simple : **gras**, *italique*, - liste, ## titre, [texte](url)", after: wikiField() },
    { key: "linksText", label: "Liens (un par ligne : Libellé | URL)", type: "textarea", rows: 3 }
  ], {
    name: c?.name || "", start: c ? c.start : year, end: c ? c.end : year + 200,

  }, v => {

    mutate(() => {
      const o = c || { id: uid("civ") };
      Object.assign(o, {
        name: v.name.trim(), start: v.start, end: v.end === null ? Y1 : v.end,
        region: v.region.trim(), color: v.color, description: v.description, links: textToLinks(v.linksText)
      });
      if (isNew) db.civs.push(o);
      sel = { type: "civ", id: o.id };
    });
    renderAll();
    if (isNew) toast("Civilisation créée — tracez maintenant un territoire");
  });
}

/* Reprendre un contour existant plutôt que tout retracer : celui de la période
   précédente, ou celui d'une autre civilisation dont on hérite du territoire. */
function openTerrCopy(civId, presetId) {
  const c = civ(civId);
  if (!db.territories.some(t => t.rings && t.rings.length)) return setMode("drawTerr", { civId });
  const own = terrOf(civId);
  const preset = presetId ? byId(db.territories, presetId)
    : (own.filter(t => t.start <= year).pop() || own[own.length - 1] || null);
  let srcId = preset ? preset.id : null;

  const body = el("div", { class: "body" });
  const civSel = el("select"), terrSel = el("select");
  const label = el("input", { type: "text", placeholder: "Après les conquêtes de …" });
  const fStart = el("input", { type: "text" }), fEnd = el("input", { type: "text" });

  db.civs.filter(x => db.territories.some(t => t.civId === x.id))
    .sort((a, b) => a.name.localeCompare(b.name, "fr"))
    .forEach(x => civSel.append(el("option", { value: x.id }, x.name)));
  civSel.value = preset ? preset.civId : (civSel.querySelector(`option[value="${civId}"]`) ? civId : civSel.options[0].value);

  function fillTerr() {
    terrSel.textContent = "";
    terrOf(civSel.value).forEach(t => terrSel.append(el("option", { value: t.id }, (t.label || "Sans intitulé") + " · " + fmtSpan(t.start, t.end))));
    if (srcId && terrSel.querySelector(`option[value="${srcId}"]`)) terrSel.value = srcId;
    syncDates();
  }
  function syncDates() {
    const t = byId(db.territories, terrSel.value); if (!t) return;
    fStart.value = String(clamp(t.end + 1, c.start, c.end ?? Y1));
    fEnd.value = String(c.end ?? Y1);
  }
  civSel.addEventListener("change", () => { srcId = null; fillTerr(); });
  terrSel.addEventListener("change", () => { srcId = terrSel.value; syncDates(); });

  const f = (lab, ctrl, help) => el("div", { class: "f" }, [el("label", {}, lab), ctrl, help ? el("div", { class: "help" }, help) : null]);
  body.append(f("Reprendre le tracé de", civSel, "Une autre civilisation si celle-ci hérite de son territoire."));
  body.append(f("Période source", terrSel));
  body.append(f("Intitulé de la nouvelle phase", label));
  body.append(el("div", { class: "grid2" }, [f("Valable à partir de", fStart), f("Jusqu'à", fEnd)]));
  body.append(el("p", { class: "note" }, "Le contour est copié tel quel : vous pourrez ensuite déplacer, ajouter ou retirer ses sommets."));

  const scrim = el("div", { class: "scrim", onclick: e => { if (e.target === scrim) close(); } },
    el("div", { class: "modal" }, [
      el("header", {}, [el("h3", {}, "Reprendre un tracé — " + c.name), el("button", { class: "iconbtn", onclick: () => close() }, "✕")]),
      body,
      el("footer", {}, [
        el("button", { class: "btn", style: "margin-right:auto", onclick: () => { close(); setMode("drawTerr", { civId }); } }, "Tracer à la place"),
        el("button", { class: "btn", onclick: () => close() }, "Annuler"),
        el("button", { class: "btn prim", onclick: commit }, "Reprendre")
      ])
    ]));
  function close() { scrim.remove(); document.removeEventListener("keydown", key, true); }
  function key(e) { if (e.key === "Escape") { e.stopPropagation(); close(); } }
  document.addEventListener("keydown", key, true);
  $("#modalRoot").append(scrim);
  fillTerr();
  setTimeout(() => label.focus(), 20);

  function commit() {
    const src = byId(db.territories, terrSel.value);
    const st = parseYear(fStart.value), en = parseYear(fEnd.value);
    if (!src) return;
    if (st === null || en === null) { toast("Dates incomplètes"); return; }
    let id;
    mutate(() => {

const qIn = $("#q"), qRes = $("#qres");
let qIdx = -1, qItems = [];
function runSearch() {
  const v = qIn.value.trim().toLowerCase();
  qRes.textContent = ""; qItems = []; qIdx = -1;
  if (v.length < 2) { qRes.classList.remove("on"); return; }
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const n = norm(v);
  const add = (label, arr, fmt, act) => {
    const hits = arr.filter(o => norm(fmt.text(o)).includes(n)).slice(0, 6);
    if (!hits.length) return;
    qRes.append(el("b", {}, label));
    hits.forEach(o => {
      const b = el("button", { onclick: () => { act(o); qRes.classList.remove("on"); qIn.value = ""; } }, [
        fmt.dot ? el("span", { class: "dot", style: `background:${fmt.dot(o)}` }) : null,
        el("span", {}, fmt.text(o)), el("span", { class: "yr" }, fmt.year(o))
      ]);
      qItems.push(b); qRes.append(b);
    });
  };
  add("Civilisations", db.civs, { text: c => c.name, year: c => fmtSpan(c.start, c.end), dot: c => c.color }, c => select("civ", c.id));
  add("Lieux", db.pois, { text: p => p.name, year: p => (p.civId ? civ(p.civId)?.name : KINDS[p.kind]) || "" }, p => select("poi", p.id, { fit: true }));
  add("Événements", db.events, { text: e => e.title, year: e => fmtYear(e.year, true) }, e => select("event", e.id));
  if (!qItems.length) qRes.append(el("b", {}, "Aucun résultat"));
  qRes.classList.add("on");
}
qIn.addEventListener("input", runSearch);
qIn.addEventListener("focus", () => { if (qIn.value.trim().length > 1) qRes.classList.add("on"); });
qIn.addEventListener("keydown", e => {
  if (e.key === "Escape") { qIn.value = ""; qRes.classList.remove("on"); qIn.blur(); }
  if (!qItems.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    qItems[qIdx]?.classList.remove("cur");
    qIdx = (qIdx + (e.key === "ArrowDown" ? 1 : -1) + qItems.length) % qItems.length;
    qItems[qIdx].classList.add("cur"); qItems[qIdx].scrollIntoView({ block: "nearest" });
  }
  if (e.key === "Enter") { e.preventDefault(); (qItems[qIdx] || qItems[0]).click(); }
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) qRes.classList.remove("on"); });

function doExport() {
  const blob = new Blob([JSON.stringify({ v: 1, exported: new Date().toISOString(), db }, null, 1)], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: `atlas-civilisations-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a); a.click(); a.remove();
  toast("Fichier exporté");
}
function doImport() {
  const inp = el("input", { type: "file", accept: ".json,application/json" });
  inp.addEventListener("change", async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      const d = j.db || j;
      if (!d.civs) throw 0;
      const merge = db.civs.length && confirm("Fusionner avec le contenu actuel ?\n\nOK = fusionner · Annuler = remplacer");
      mutate(() => {
        if (!merge) db = { civs: [], territories: [], events: [], pois: [], links: [], subjections: [] };
        const ids = new Set(db.civs.map(c => c.id));
        for (const k of ["civs", "territories", "events", "pois", "links", "subjections"]) (d[k] || []).forEach(o => {
          if (k === "civs" && ids.has(o.id)) return;
          db[k].push(o);
        });
      });
      sel = null; renderAll(); toast("Contenu importé");
    } catch (e) { toast("Fichier illisible"); }
  });
  inp.click();
}

function helpModal() {
  const root = $("#modalRoot");
  const body = el("div", { class: "body prose" });
  body.innerHTML = md(`## Ce que fait cet atlas
La frise commande la carte : à l'année où se trouve le curseur, la carte affiche les territoires, les villes et les lieux actifs. Cliquez sur un territoire, un lieu ou une bande de la frise pour ouvrir sa fiche.

## Enrichir le contenu
- **+ Civilisation** crée une entrée avec ses dates et sa couleur.
- **+ Territoire** trace une emprise : cliquez les sommets sur la carte, *Entrée* referme le contour, puis indiquez entre quelles dates elle vaut. Un empire qui bouge = plusieurs territoires successifs.
- **+ Lieu** pose une ville, un site ou une bataille.
- Chaque fiche accepte une description (mise en forme simple), des liens, et l'import du résumé d'une page Wikipédia.

## Épisodes, étapes et mouvements
Donnez une date de fin à un événement et il devient un **épisode** : une barre sur la frise plutôt qu'un repère. Sa fiche accepte alors des **étapes** — batailles, sièges, traités — qui se rangent sur une seconde ligne sous lui.

Chaque événement accepte aussi un **lieu** posé sur la carte et des **mouvements** : des flèches tracées au clic, trait plein pour une avancée, discontinu pour un retour. Sélectionner un épisode affiche d'un coup ses étapes et ses flèches, quelle que soit l'année exacte du curseur.

## Reprendre un tracé
Sur la fiche d'une civilisation, *+ Ajouter* un territoire propose d'abord de **repartir d'un contour existant** : celui de la période précédente, ou celui d'une autre civilisation dont celle-ci hérite. Le contour est copié, puis s'ouvre directement en édition de sommets. L'icône de copie en face de chaque territoire fait la même chose à partir de cette période précise.

## Filiations
Une civilisation procède souvent d'une autre. La section *Filiation* relie les deux dans un sens ou dans l'autre, avec un intitulé et, si vous le souhaitez, l'**événement de transition** qui fixe la date du passage. La frise dessine alors un trait entre les deux bandes ; il s'allume quand l'une des deux est sélectionnée, et le clic ouvre l'événement de transition. Le bouton *Filiations*, dans l'en-tête de la frise, masque ces traits.

L'empilement des bandes suit ces liens : une civilisation issue d'une autre **reprend sa ligne, à la suite**, quand la chronologie le permet — la République romaine, l'Empire, l'Occident puis les Carolingiens se lisent ainsi d'un seul trait. Si les deux périodes se chevauchent, l'héritière se place sur la ligne libre la plus proche, ce qui rapproche les branches d'une même souche.

## Tutelles et vassalité
Une civilisation ne disparaît pas toujours quand elle est conquise : elle continue, sous contrôle étranger, puis recouvre parfois son indépendance. La section *Tutelles* enregistre ces périodes dans un sens (⤓ elle subit) ou dans l'autre (⤒ elle domine), avec leur nature — vassalité, province, protectorat, occupation, union dynastique.

Sur la carte, le territoire garde sa propre trame mais reçoit par-dessus, en croisillon, celle de la puissance dominante, un liseré discontinu et une mention en italique. Sur la frise, la bande est barrée des mêmes hachures pendant la seule durée de la tutelle. L'Égypte pharaonique en donne l'exemple : koushite, assyrienne, perse à deux reprises, puis macédonienne, sans jamais quitter la carte.

## Retoucher un tracé
Sur la fiche d'une civilisation — ou en face d'un mouvement, sur la fiche d'un événement — l'icône cible ouvre l'édition des sommets : glissez-les, cliquez un point pâle pour en insérer un, *Alt*+clic pour en retirer un. *+ Partie* ajoute une portion détachée (île, province isolée).

## Raccourcis
- **←** / **→** : reculer ou avancer d'un pas · **Maj** ×10 · **Alt** ×100
- **Échap** : quitter le mode en cours · **Entrée** : fermer le tracé
- **Ctrl/Cmd + Z** : annuler la dernière modification
- **/** : rechercher · molette : zoom (carte et frise)

## Prudence avec les tracés
Les emprises fournies sont des approximations de lecture. Les frontières anciennes sont souvent des zones d'influence graduées plutôt que des lignes ; corrigez-les selon vos sources.`);
  const scrim = el("div", { class: "scrim", onclick: e => { if (e.target === scrim) scrim.remove(); } },
    el("div", { class: "modal" }, [
      el("header", {}, [el("h3", {}, "Mode d'emploi"), el("button", { class: "iconbtn", onclick: () => scrim.remove() }, "✕")]),
      body,
      el("footer", {}, el("button", { class: "btn prim", onclick: () => scrim.remove() }, "Fermer"))
    ]));
  root.append(scrim);
}

document.addEventListener("keydown", e => {
  const typing = /input|textarea|select/i.test(e.target.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); qIn.focus(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); return; }
  if (typing) return;
  if (e.key === "Escape") {
    const scrims = $$(".scrim");
    if (scrims.length) { scrims[scrims.length - 1].remove(); return; }
    if (mode !== "select") setMode("select"); else select(null);
  }
  if (e.key === "Enter" && (mode === "drawTerr" || mode === "drawArrow")) finishDraft();
  if (e.key === "Backspace" && draft && draft.pts.length) { e.preventDefault(); draft.pts.pop(); drawEditLayer(); }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    const step = e.altKey ? 100 : e.shiftKey ? 10 : 1;
    setYear(year + (e.key === "ArrowRight" ? step : -step));
  }
});

$("#tlAll").onclick = () => { tview = { a: Y0, b: Y1 }; renderTimeline(); };
$("#tlFilter").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tlFilter = b.dataset.f;
  $$("#tlFilter button").forEach(x => x.classList.toggle("on", x === b));
  renderTimeline();
});
$$(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; renderPanel(); });

function renderAll() { renderMap(); renderTimeline(); renderPanel(); }

/* =====================  DÉMARRAGE  ===================== */
/* compatibilité avec les sauvegardes antérieures aux événements longs */
function migrate() {
  if (!db.subjections) {
    const ids = new Set(db.civs.map(c => c.id));
    db.subjections = buildSeed().subjections.filter(x => ids.has(x.civId) && ids.has(x.overId));
  }
  if (!db.links) {
    /* première ouverture après l'ajout des filiations : on récupère celles du
       fonds d'origine, pour les civilisations encore présentes */
    const ids = new Set(db.civs.map(c => c.id)), evs = new Set(db.events.map(e => e.id));
    db.links = buildSeed().links.filter(l => ids.has(l.from) && ids.has(l.to))
      .map(l => Object.assign({}, l, { eventId: evs.has(l.eventId) ? l.eventId : null }));
  }
  for (const e of db.events) {
    if (e.end === undefined) e.end = e.year;
    if (e.parentId === undefined) e.parentId = null;
    if (!e.arrows) e.arrows = [];
    if (e.lon === undefined) { e.lon = null; e.lat = null; }
    if (!e.kind) e.kind = "jalon";
  }
}
(async function init() {
  const restored = await load();
  if (!restored) { db = buildSeed(); setSaveState("fonds d'origine"); save(); }
  migrate(); drawLand(); drawGrid(); drawRivers();
  applyView();
  setYear(year, true);
  renderAll();
  if (!restored) setTimeout(() => toast("Fonds d'origine chargé — " + db.civs.length + " civilisations"), 400);
})();
</script>
